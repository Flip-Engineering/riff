name: Validate Riff
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.0.2'
          elixir-version: '1.18.4'
      - run: rustc --version
      - run: mix deps.get --check-locked
        working-directory: installer
      - run: mix check
        working-directory: installer
      - run: python3 -B -m unittest discover -s tests -p 'test_score_integration.py' -v
        env:
          RIFF_REQUIRE_SCORE_INTEGRATION: '1'
      - run: elixir runtime/test/admission_test.exs
      - run: elixir runtime/test/resources_test.exs
      - run: elixir desktop/test/build_test.exs
      - run: elixir tests/native_capabilities_test.exs
      - run: python3 -m unittest discover -s installer/test -p '*_test.py' -v
  application:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python studio.py --check
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_release.py
      - run: python scripts/check_install.py dist/riff-v$(cat VERSION).tar.gz
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results
          path: test-results/
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: metal
          - os: ubuntu-24.04
            backend: cpu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.0.2'
          elixir-version: '1.18.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python setup_engine.py --backend ${{ matrix.backend }} --build-only --jobs 2
      - run: python scripts/check_native_solver.py
      - run: elixir scripts/check_native_score_replay.exs --download-tokenizer --output data/native-score-check
      - run: elixir scripts/check_native_acoustic.exs --tokenizer data/native-score-check/yue2-qwen.tiktoken
      - if: matrix.backend == 'metal'
        run: python scripts/check_native_attention.py
  cuda:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
    steps:
      - run: apt-get update && apt-get install -y git python3 python3-venv cmake build-essential
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 setup_engine.py --backend cuda --compile-only --cuda-arch '86' --jobs 2
