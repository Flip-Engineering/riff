name: Validate Riff
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      linux-source-only:
        description: Qualify source archives on Linux without claiming Apple or desktop support
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels that pull request's earlier run, so
# superseded commits do not hold the shared homelab runners. Every other run
# gets its own group and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  control:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, riff-linux]
    steps:
      - name: Keep temporary files, Mix and Hex inside this job
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "MIX_HOME=$RUNNER_TEMP/mix"
            echo "HEX_HOME=$RUNNER_TEMP/hex"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Identify the self-hosted Ubuntu image
        run: |
          set -euo pipefail
          . /etc/os-release
          case "$ID:$VERSION_ID" in
            ubuntu:22.04) echo 'ImageOS=ubuntu22' >> "$GITHUB_ENV" ;;
            ubuntu:24.04) echo 'ImageOS=ubuntu24' >> "$GITHUB_ENV" ;;
            ubuntu:26.04) echo 'ImageOS=ubuntu26' >> "$GITHUB_ENV" ;;
            *) echo "Unsupported self-hosted BEAM target: $ID:$VERSION_ID" >&2; exit 1 ;;
          esac
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.0.2'
          elixir-version: '1.18.4'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: rustc --version
      - run: mix deps.get --check-locked
        working-directory: installer
      - run: mix check
        working-directory: installer
      - run: python3 -B -m unittest discover -s tests -p 'test_score_integration.py' -v
        env:
          RIFF_REQUIRE_SCORE_INTEGRATION: '1'
      - run: python3 -B -m unittest discover -s tests -p 'test_acoustic_integration.py' -v
        env:
          RIFF_REQUIRE_SCORE_INTEGRATION: '1'
      - run: elixir runtime/test/admission_test.exs
      - run: elixir runtime/test/resident_test.exs
      - run: elixir runtime/test/resources_test.exs
      - run: elixir desktop/test/build_test.exs
      - run: elixir tests/native_capabilities_test.exs
      - run: elixir tests/native_cache_test.exs
      - run: python3 -m unittest discover -s installer/test -p '*_test.py' -v
  application:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, riff-linux]
    strategy:
      # One Python version's failure must not cancel the other's run.
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - name: Keep temporary files, Mix and Hex inside this job
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "MIX_HOME=$RUNNER_TEMP/mix"
            echo "HEX_HOME=$RUNNER_TEMP/hex"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python studio.py --check
      - name: Verify provisioned FFmpeg
        run: |
          set -euo pipefail
          test "$(dpkg-query -W -f='${db:Status-Status}' ffmpeg 2>/dev/null || true)" = installed
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_release.py
      - run: python scripts/check_install.py "dist/riff-v$(cat VERSION).tar.gz"
  browser:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, riff-linux]
    steps:
      - name: Keep temporary files, Mix and Hex inside this job
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "MIX_HOME=$RUNNER_TEMP/mix"
            echo "HEX_HOME=$RUNNER_TEMP/hex"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify provisioned browser dependencies
        run: |
          set -euo pipefail
          for package in ffmpeg build-essential pkg-config nasm zlib1g-dev python3-venv libncurses-dev libssl-dev; do
            test "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" = installed
          done
      - run: npx playwright install chromium
      - run: npm run test:all-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results
          path: test-results/
  native:
    # Preserve the existing check names while selecting the backend matrix.
    name: ${{ format('native ({0}, {1})', matrix.backend == 'cpu' && '["self-hosted","Linux","X64","riff-linux"]' || (vars.RIFF_APPLE_RUNNER_LABEL != '' && format('["self-hosted","macOS","ARM64",{0}]', toJSON(vars.RIFF_APPLE_RUNNER_LABEL)) || '["self-hosted","Linux","X64","riff-linux"]'), matrix.backend) }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # Ordinary push/PR/manual validation retains both backends. Only an
        # explicit reusable-workflow caller can select Linux source qualification.
        backend: ${{ fromJSON(inputs.linux-source-only && '["cpu"]' || '["cpu","metal"]') }}
    # Missing Apple infrastructure still runs its diagnostic on riff-linux in
    # ordinary validation; source-only qualification never selects that lane.
    runs-on: ${{ fromJSON(matrix.backend == 'cpu' && '["self-hosted","Linux","X64","riff-linux"]' || (vars.RIFF_APPLE_RUNNER_LABEL != '' && format('["self-hosted","macOS","ARM64",{0}]', toJSON(vars.RIFF_APPLE_RUNNER_LABEL)) || '["self-hosted","Linux","X64","riff-linux"]')) }}
    steps:
      - name: Keep temporary files, Mix and Hex inside this job
        if: runner.os == 'Linux'
        run: |
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "MIX_HOME=$RUNNER_TEMP/mix"
            echo "HEX_HOME=$RUNNER_TEMP/hex"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the operator-owned Apple runner (#31)
        if: matrix.backend == 'metal'
        uses: ./.github/actions/require-apple-runner
        with:
          runner-label: ${{ vars.RIFF_APPLE_RUNNER_LABEL }}
      - name: Identify the self-hosted Ubuntu image
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          case "$ID:$VERSION_ID" in
            ubuntu:22.04) echo 'ImageOS=ubuntu22' >> "$GITHUB_ENV" ;;
            ubuntu:24.04) echo 'ImageOS=ubuntu24' >> "$GITHUB_ENV" ;;
            ubuntu:26.04) echo 'ImageOS=ubuntu26' >> "$GITHUB_ENV" ;;
            *) echo "Unsupported self-hosted BEAM target: $ID:$VERSION_ID" >&2; exit 1 ;;
          esac
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28.0.2'
          elixir-version: '1.18.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Provide ephemeral compiler-cache access
        if: runner.os == 'Linux'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            if (token) core.setSecret(token);
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Build native backend through the shared compile queue
        if: runner.os == 'Linux'
        run: scripts/run_native_build_queued.sh ${{ matrix.backend }} --build-only --jobs 2
      - name: Build the Metal backend directly
        if: runner.os == 'macOS'
        run: elixir scripts/build_cached_native.exs --backend metal --compile-only --jobs 2
      - name: Select the Metal build for CPU synthetic checks (not Metal inference)
        if: runner.os == 'macOS'
        run: python3 scripts/configure_native_checks.py
      - run: python scripts/check_native_solver.py
      - run: python scripts/check_native_lora.py --output data/native-lora-check
      - run: elixir scripts/check_native_score_replay.exs --download-tokenizer --output data/native-score-check
      - run: elixir scripts/check_native_acoustic.exs --tokenizer data/native-score-check/yue2-qwen.tiktoken
      - name: Run Metal attention where supported (explicit device skip otherwise)
        if: matrix.backend == 'metal'
        run: python3 scripts/check_native_attention.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-cache-${{ matrix.backend }}
          path: native-cache-receipts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-lora-${{ matrix.backend }}
          path: |
            data/native-lora-check/receipt.json
            data/native-lora-check/numerical.log
          if-no-files-found: ignore
