name: Release Riff
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Verify version and package
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python scripts/package_release.py
          python scripts/check_install.py dist/riff-v$(cat VERSION).tar.gz
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/riff-*.tar.gz dist/install.py dist/SHA256SUMS --verify-tag --generate-notes --title "Riff $GITHUB_REF_NAME"
