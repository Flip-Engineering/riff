name: Release Riff Linux-qualified source
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      linux-source-only: true
  release:
    needs: validate
    runs-on: [self-hosted, Linux, X64, riff-linux]
    permissions:
      contents: write
    steps:
      - name: Keep release temporary files inside this job
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Verify provisioned release tools
        run: |
          set -euo pipefail
          for tool in git gh python3 sha256sum; do command -v "$tool"; done
      - name: Verify version and package
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python scripts/package_release.py
          python scripts/check_install.py dist/riff-v$(cat VERSION).tar.gz
      # Prebuilt Linux x86-64 engines, compiled in ubuntu:24.04 with no GPU device.
      # The CUDA engine holds no NVIDIA file; see scripts/build_linux_engine.sh.
      # An engine built before on this runner from the same native source (the
      # runner's RIFF_PREBUILT_ENGINES directory) is used once it passes the same
      # checks a guest makes (version, backend, native fingerprint, every file's
      # digest); otherwise the engine is built here.
      - name: Build prebuilt Linux engines
        env:
          RIFF_ENGINE_DOCKER_CONTEXT: default
        run: |
          set -euo pipefail
          mkdir -p dist
          for backend in cpu cuda; do
            asset="riff-engine-$backend-linux-x64-v$(cat VERSION).tar.gz"
            staged="${RIFF_PREBUILT_ENGINES:-}/$asset"
            if [ -n "${RIFF_PREBUILT_ENGINES:-}" ] && [ -f "$staged" ]; then
              cp "$staged" "dist/$asset"
              RIFF_HOME="$RUNNER_TEMP/verify-$backend" python3 -c 'import hashlib, sys, setup_engine; asset = sys.argv[2]; setup_engine.prepare_prebuilt(sys.argv[1], asset, hashlib.sha256(open(asset, "rb").read()).hexdigest(), download_models=False, activate=False, probe=False)' "$backend" "dist/$asset"
              echo "Using the staged $asset"
            else
              bash scripts/build_linux_engine.sh "$backend"
            fi
            (cd dist && sha256sum "$asset" >> SHA256SUMS)
          done
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_source_release.sh
