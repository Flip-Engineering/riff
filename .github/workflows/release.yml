name: Release Riff Linux-qualified source
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      linux-source-only: true
  release:
    needs: validate
    runs-on: [self-hosted, Linux, X64, riff-linux]
    permissions:
      contents: write
    steps:
      - name: Keep release temporary files inside this job
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Verify provisioned release tools
        run: |
          set -euo pipefail
          for tool in git gh python3 sha256sum; do command -v "$tool"; done
      - name: Verify version and package
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python scripts/package_release.py
          python scripts/check_install.py dist/riff-v$(cat VERSION).tar.gz
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_source_release.sh
